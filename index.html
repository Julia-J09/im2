<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Babyname Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Babylonica&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oooh+Baby&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="baby-icon-container">
         <img src="babyiconneutral.gif" alt="Baby Icon" class="baby-icon"/>
      </div>
      <form id="filterForm">
        <fieldset>
          <legend>Geschlecht</legend>
          <label><input type="radio" name="gender" value="boy" checked /> Junge</label>
          <label><input type="radio" name="gender" value="girl" /> Mädchen</label>
        </fieldset>
        <fieldset>
          <legend>Jahr</legend>
          <div class="years">
            <label><input type="radio" name="year" value="2023" checked />2023</label>
            <label><input type="radio" name="year" value="2022" />2022</label>
            <label><input type="radio" name="year" value="2021" />2021</label>
            <label><input type="radio" name="year" value="2020" />2020</label>
            <label><input type="radio" name="year" value="2019" />2019</label>
            <label><input type="radio" name="year" value="2018" />2018</label>
            <label><input type="radio" name="year" value="2017" />2017</label>
            <label><input type="radio" name="year" value="2016" />2016</label>
            <label><input type="radio" name="year" value="2015" />2015</label>
            <label><input type="radio" name="year" value="2014" />2014</label>
            <label><input type="radio" name="year" value="2013" />2013</label>
            <label><input type="radio" name="year" value="2012" />2012</label>
            <label><input type="radio" name="year" value="2011" />2011</label>
            <label><input type="radio" name="year" value="2010" />2010</label>
            <label><input type="radio" name="year" value="2009" />2009</label>
            <label><input type="radio" name="year" value="2008" />2008</label>
            <label><input type="radio" name="year" value="2007" />2007</label>
            <label><input type="radio" name="year" value="2006" />2006</label>
            <label><input type="radio" name="year" value="2005" />2005</label>
            <label><input type="radio" name="year" value="2004" />2004</label>
            <label><input type="radio" name="year" value="2003" />2003</label>
            <label><input type="radio" name="year" value="2002" />2002</label>
            <label><input type="radio" name="year" value="2001" />2001</label>
            <label><input type="radio" name="year" value="2000" />2000</label>
          </div>
        </fieldset>
        <button type="submit">anwenden</button>
      </form>
    </aside>

    <main>
      <h1>-Wie heissed d Kids vo SG-</h1>
      <div class="search-box">
        <input type="text" id="nameInput" placeholder="Search your Name..." />
    
      </div>
      
      <div class="info-box">
        <h2>Erfahre.....</h2>
        <h2>...wie beliebt dein Name ist</h2>
        <p>1. Gib deinen Wunschnamen in der Searchbar ein</p>
        <h2>oder</h2>
        <h2>...was der beliebteste Jungen- oder Mädchenname im Jahr "xy" war</h2>
        <p>1. Wähle das Geschlecht aus<br />2. Wähle das Geburtsjahr aus</p>
      </div>
      
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
